version: '3.8'

services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: smart-home-mqtt
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/certs:/mosquitto/certs
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: smart-home-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///data/smart_home.db
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - MQTT_USE_TLS=true
      - MQTT_TLS_PORT=8883
      - MQTT_CA_CERTS=/certs/server.crt
      - JWT_SECRET=${JWT_SECRET:-smart-home-a9-secret}
      - JWT_EXPIRE_HOURS=24
      - DEBUG=true
    volumes:
      - ./data:/app/data
      - ./mosquitto/certs:/certs:ro
    depends_on:
      - mqtt
    restart: unless-stopped

  simulators:
    build: ./simulators
    container_name: smart-home-simulators
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
    depends_on:
      - mqtt
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: smart-home-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped
